<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Visitation — An Advent Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* two-font system: editorial serif for display/verse/prompt,
       neutral sans for everything else */
    --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;

    /* type scale -- used consistently everywhere, no ad-hoc sizes */
    --fs-eyebrow: 0.85rem;
    --fs-h1: clamp(2.2rem, 5vw, 3rem);
    --fs-subtitle: 1.2rem;
    --fs-body: 1.08rem;
    --fs-small: 0.95rem;
    --fs-verse: 1.55rem;
    --fs-modal-body: 1.14rem;
    --fs-button: 1rem;

    /* colors -- warm ivory, charcoal, restrained violet accent */
    --ink: #211f1c;
    --ink-soft: #5c5850;
    --parchment: #211f1c;
    --muted: #6f6a5e;
    --night-1: #f7f5f1;
    --night-2: #f2efe9;
    --board-deep: #efe9e0;
    --board-warm: #f3efe8;
    --gold: #6b6357;
    --gold-bright: #4d3f73;
    --accent-modal: #6b6357;
    --ember-1: #211f1c;
    --ember-2: #000000;
    --line: rgba(33,31,28,0.12);
    --violet: #4d3f73;
    --teal: #4fae9e;

    --tile-h: 88px;
    --tile-h-mobile: 64px;
    --rail-w: 78px;
    --rail-w-mobile: 46px;
    --center-w: 430px;
    --center-w-mobile: 230px;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(77,63,115,0.05), transparent 55%),
      linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-1) 100%);
    color: var(--parchment);
    font-family: var(--font-body);
    font-size: var(--fs-body);
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  button{ font-family: inherit; }

  /* ---------- App shell ---------- */
  #app{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 16px 56px;
    overflow-x:hidden;
  }

  .screen{
    width:100%;
    max-width: 980px;
    margin: 0 auto;
  }

  /* ---------- Header (always visible, no gate) ---------- */
  #header{
    text-align:center;
    padding: 0 20px 36px;
    animation: fadeIn 1.1s ease both;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  .eyebrow{
    font-family: var(--font-body);
    font-weight:600;
    font-size: var(--fs-eyebrow);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  #header h1{
    font-family: var(--font-display);
    font-weight:600;
    font-size: var(--fs-h1);
    letter-spacing: 0.01em;
    margin: 10px 0 8px;
    color: var(--parchment);
    text-shadow: 0 0 30px rgba(240,217,154,0.15);
  }

  #header .subtitle{
    font-family: var(--font-display);
    font-weight:600;
    font-size: var(--fs-subtitle);
    color: var(--gold-bright);
    margin: 0 0 22px;
  }

  #header p.lede{
    font-family: var(--font-body);
    max-width: 46ch;
    margin: 0 auto 10px;
    color: var(--parchment);
    opacity: 0.8;
    font-size: var(--fs-body);
    line-height:1.65;
  }

  #header p.lede-instructions{
    font-family: var(--font-body);
    max-width: 46ch;
    margin: 0 auto;
    color: var(--parchment);
    opacity: 0.65;
    font-size: var(--fs-body);
    line-height:1.65;
  }
  #header p.lede-instructions em{ font-style: normal; font-weight:600; color: var(--gold-bright); opacity:1; }

  /* ---------- Top bar ---------- */
  #topbar{
    display:flex;
    align-items:center;
    justify-content:center;
    max-width: 980px;
    margin: 0 auto 14px;
    padding: 0 6px;
  }
  .link-btn{
    background:none; border:none; cursor:pointer;
    color: var(--parchment);
    opacity: 0.7;
    font-family: var(--font-body);
    font-size: var(--fs-small);
    padding: 6px 4px;
    border-bottom: 1px solid transparent;
    transition: opacity 0.3s ease, border-color 0.3s ease;
  }
  .link-btn:hover{ opacity:1; border-color: rgba(240,217,154,0.4); }
  .link-btn:focus-visible{ outline: 1px solid var(--gold-bright); outline-offset:3px; }

  /* ---------- Board ---------- */
  .progress-line{
    text-align:center;
    font-family: var(--font-body);
    font-weight:600;
    font-size: var(--fs-small);
    color: var(--gold);
    margin: 0 0 4px;
  }
  .board-instructions{
    text-align:center;
    font-family: var(--font-body);
    font-size: var(--fs-small);
    color: var(--parchment);
    opacity: 0.72;
    margin: 0 0 18px;
  }

  #board{
    position:relative;
    display:flex;
    align-items:stretch;
    justify-content:center;
    gap: 0;
    padding: 30px 14px;
    border-radius: 18px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(77,63,115,0.06), transparent 60%),
      linear-gradient(180deg, var(--board-deep), var(--board-warm) 90%);
    box-shadow:
      0 0 0 1px var(--line),
      0 20px 50px rgba(33,31,28,0.08);
  }

  .finial{
    position:absolute;
    top: -12px; left:50%; transform: translateX(-50%);
    width:15px; height:24px;
    z-index:4;
  }
  .finial svg{ width:100%; height:100%; filter: drop-shadow(0 0 4px rgba(79,174,158,0.35)); }

  .rail{
    position: relative;
    width: var(--rail-w);
    flex: 0 0 var(--rail-w);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--line);
    background-repeat: repeat-y;
    background-position: top center;
    background-size: 100% var(--tile-h);
    filter: saturate(0.75) brightness(0.9);
    transition: filter 1.4s ease;
  }

  .rail-overlay-vignette{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(33,31,28,0.06), transparent 12%, transparent 88%, rgba(33,31,28,0.06));
    pointer-events:none;
  }

  .tile{
    position:absolute;
    left:0; width:100%;
    border:none;
    background: transparent;
    cursor: default;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tile-hit{
    width: 92%;
    height: 94%;
    border-radius: 3px;
    display:flex; align-items:center; justify-content:center;
    background-image: var(--unit-bg);
    background-size: cover;
    background-position: center;
    filter: saturate(0.68) brightness(0.82) contrast(0.95);
    box-shadow: 0 0 0 1px rgba(33,31,28,0.15) inset;
    transition: filter 0.9s ease, box-shadow 0.4s ease, transform 0.3s ease;
  }

  .tile.locked{ cursor: not-allowed; }
  .tile.locked .tile-hit{ opacity: 0.55; }

  .tile.active{ cursor:pointer; }
  .tile.active .tile-hit{
    position:relative;
    filter: saturate(1.05) brightness(1.12) contrast(1.05);
    box-shadow: 0 0 0 3px var(--violet), 0 0 14px 3px rgba(146,136,237,0.75);
    animation: tilePulse 1.8s ease-in-out infinite;
  }
  .tile.active .tile-hit::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius: 6px;
    border: 2px solid var(--violet);
    opacity: 0.9;
    pointer-events:none;
    animation: tileRipple 1.8s ease-out infinite;
  }
  @keyframes tilePulse{
    0%, 100%{ box-shadow: 0 0 0 3px var(--violet), 0 0 14px 3px rgba(146,136,237,0.75); }
    50%{ box-shadow: 0 0 0 3px var(--violet), 0 0 22px 7px rgba(146,136,237,0.95); }
  }
  @keyframes tileRipple{
    0%{ transform: scale(1); opacity: 0.85; }
    70%{ transform: scale(1.12); opacity: 0; }
    100%{ transform: scale(1.12); opacity: 0; }
  }
  /* One-off attention burst when a tile newly becomes active -- most
     important for the 13 -> 14 handoff, where the next pane jumps from
     the bottom of the left window to the bottom of the right window. */
  .tile.flash-new .tile-hit::before{
    content:"";
    position:absolute;
    inset:-11px;
    border-radius: 9px;
    border: 3px solid var(--violet);
    opacity: 1;
    pointer-events:none;
    animation: tileFlashBurst 1.5s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes tileFlashBurst{
    0%{ transform: scale(0.9); opacity: 1; }
    100%{ transform: scale(1.9); opacity: 0; }
  }
  .tile.active .tile-hit:hover, .tile.active .tile-hit:focus-visible{
    transform: scale(1.03);
    filter: saturate(1.1) brightness(1.15) contrast(1.05);
  }
  .tile:focus-visible{ outline:none; }
  .tile.active .tile-hit:focus-visible{ outline: 2px solid var(--violet); outline-offset: 3px; }

  .tile.done{ cursor:pointer; }
  .tile.done .tile-hit{
    filter: saturate(1.05) brightness(1.05) contrast(1.02);
    box-shadow: 0 0 0 1px rgba(33,31,28,0.15) inset;
  }
  .tile.done .tile-hit:hover{ box-shadow: 0 0 0 1.5px var(--violet); }

  .tile-index{
    font-family: var(--font-body);
    font-weight:700;
    font-size: 0.72rem;
    line-height:1;
    color: #fdfcfa;
    background: rgba(146, 136, 237, 0.62);
    border-radius: 999px;
    padding: 3px 7px;
    opacity:0;
    transition: opacity 0.4s ease;
  }
  .tile.active .tile-index{
    opacity:1;
    background: var(--violet);
    box-shadow: 0 0 8px 2px rgba(146,136,237,0.8);
  }
  .tile.done .tile-index{ opacity:1; }

  /* ---------- Center ---------- */
  #center-wrap{
    position:relative;
    width: var(--center-w);
    flex: 0 0 var(--center-w);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #center-frame{
    position:relative;
    width:100%;
    height:100%;

    background-position: top center;
    background-size: 100% auto;
    box-shadow: 0 0 0 1px rgba(203,166,96,0.22);
    filter: saturate(0.35) brightness(0.55) contrast(0.82);
    transition: filter 1.8s ease;
  }
  #center-oval-mask{
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    width: 72%;
    height: 58%;
    border-radius: 50%;
    overflow:hidden;
    box-shadow: 0 0 0 1px var(--line);
    background: #ece8e1;
  }
  #center-image{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    object-position: 50% 34%;
    filter: saturate(0.3) brightness(0.6) contrast(0.84);
    transform: scale(1.02);
    transition: filter 1.8s ease;
  }
  #wreath{
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%) scale(0.94);
    width: calc(72% + 46px);
    height: calc(58% + 46px);
    opacity: 0;
    pointer-events:none;
    transition: opacity 1.4s ease, transform 1.4s ease;
    z-index: 3;
  }
  #wreath.show{
    opacity: 1;
    transform: translate(-50%,-50%) scale(1);
  }
  #wreath svg{ width:100%; height:100%; overflow:visible; }

  .center-caption{
    position:absolute;
    bottom: -28px; left:50%; transform:translateX(-50%);
    font-family: var(--font-display);
    font-style: italic;
    font-size: var(--fs-small);
    color: var(--parchment);
    opacity: 0.5;
    white-space: nowrap;
  }

  /* ---------- Modal ---------- */
  #modal-backdrop{
    position:fixed; inset:0;
    background: rgba(24,22,19,0.4);
    backdrop-filter: blur(2px);
    display:none;
    align-items:center; justify-content:center;
    padding: 20px;
    z-index: 50;
    animation: fadeIn 0.4s ease both;
  }
  #modal{
    width:100%;
    max-width: 480px;
    background: #fffdfa;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 38px 34px 30px;
    box-shadow: 0 24px 60px rgba(33,31,28,0.14);
    position:relative;
    animation: modalIn 0.5s cubic-bezier(.2,.8,.3,1) both;
    max-height: 86vh;
    overflow-y:auto;
  }
  @keyframes modalIn{ from{ opacity:0; transform: translateY(14px) scale(0.98);} to{opacity:1; transform:none;} }

  #modal .modal-close{
    position:absolute; top:14px; right:16px;
    background:none; border:none;
    font-size:1.5rem; line-height:1;
    color: var(--ink-soft);
    opacity:0.5;
    cursor:pointer;
  }
  #modal .modal-close:hover{ opacity:1; }

  #modal .modal-prompt-label{
    font-family: var(--font-body);
    font-weight:600;
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  #modal .modal-verse{
    font-family: var(--font-display);
    font-style: normal;
    font-weight: 500;
    font-size: var(--fs-verse);
    line-height:1.35;
    margin: 0 0 18px;
    color: var(--ink);
  }
  #modal .modal-interpretation{
    font-family: var(--font-body);
    font-size: var(--fs-modal-body);
    line-height:1.55;
    color: var(--ink-soft);
    margin: 0 0 22px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  #modal .modal-prompt{
    font-family: var(--font-display);
    font-style: normal;
    font-size: var(--fs-modal-body);
    line-height:1.5;
    margin: 0 0 28px;
    color: var(--ink);
  }
  /* The prompt paragraph shares the .modal-interpretation class (border-bottom
     divider) but sits directly above the Illuminate button, so that divider
     reads as "more content below" and encourages unnecessary scrolling.
     Strip it here while keeping the divider on verse/interpretation above. */
  #modal-prompt{
    border-bottom: none !important;
    padding-bottom: 0 !important;
  }
  .btn-illuminate{
    display:block;
    width:100%;
    background: var(--violet);
    color: #fbfafd;
    border:none;
    padding: 13px 20px;
    border-radius: 9px;
    font-family: var(--font-body);
    font-weight:600;
    font-size: var(--fs-button);
    cursor:pointer;
    box-shadow: none;
    transition: background 0.2s ease;
  }
  .btn-illuminate:hover{ background: var(--violet); color: #fbfafd;}
  .btn-illuminate:focus-visible{ outline: 2px solid var(--violet); outline-offset:3px; }

  .modal-done-badge{
    font-family: var(--font-body);
    font-size: var(--fs-small);
    color: var(--ink-soft);
    text-align:center;
    padding-top: 4px;
  }

  /* ---------- Restart confirm ---------- */
  #restart-confirm-backdrop{
    position:fixed; inset:0;
    background: rgba(24,22,19,0.4);
    backdrop-filter: blur(2px);
    display:none;
    align-items:center; justify-content:center;
    padding: 20px;
    z-index: 60;
    animation: fadeIn 0.4s ease both;
  }
  #restart-confirm{
    width:100%;
    max-width: 360px;
    background: #fffdfa;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 30px 28px 26px;
    box-shadow: 0 24px 60px rgba(33,31,28,0.16);
    text-align:center;
    animation: modalIn 0.4s cubic-bezier(.2,.8,.3,1) both;
  }
  #restart-confirm-title{
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 500;
    margin: 0 0 10px;
    color: var(--ink);
  }
  #restart-confirm-body{
    font-family: var(--font-body);
    font-size: var(--fs-small);
    color: var(--ink-soft);
    margin: 0 0 26px;
    line-height:1.5;
  }
  #restart-confirm-actions{
    display:flex;
    gap:10px;
  }
  #restart-confirm-actions .btn-illuminate{ flex:1; }
  .btn-secondary{
    flex:1;
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 13px 20px;
    border-radius: 9px;
    font-family: var(--font-body);
    font-weight:600;
    font-size: var(--fs-button);
    cursor:pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .btn-secondary:hover{ background: rgba(33,31,28,0.05); color: var(--ink); }
  .btn-secondary:focus-visible{ outline: 2px solid var(--violet); outline-offset:2px; }

  /* ---------- Final ---------- */
  #final{
    display:none;
    text-align:center;
    padding: 40px 20px 10px;
    animation: fadeIn 1.4s ease both;
  }
  #final .final-line1{
    font-family: var(--font-display);
    font-style: italic;
    font-weight:600;
    font-size: var(--fs-subtitle);
    color: var(--gold-bright);
    margin: 0 0 10px;
    line-height:1.5;
  }
  #final .final-line2{
    font-family: var(--font-body);
    font-size: var(--fs-small);
    color: var(--parchment);
    opacity: 0.65;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 720px){
    :root{
      --tile-h: var(--tile-h-mobile);
      --rail-w: var(--rail-w-mobile);
      --center-w: var(--center-w-mobile);
    }
    #board{ padding: 22px 8px; }
    #rail-left{ margin-right:8px; }
    #rail-right{ margin-left:8px; }
    #modal{ padding: 30px 22px 24px; }
    #modal .modal-verse{ font-size: 1.35rem; }
  }
  @media (max-width: 420px){
    :root{ --center-w: 168px; --rail-w: 36px; --tile-h: 52px; }
  }

  /* ---------- Responsive layout refinements ---------- */
  :root{
    --tile-h: clamp(48px, 6.4vh, 58px);
    --rail-w: clamp(54px, 7vw, 72px);
    --center-w: clamp(300px, 42vw, 440px);
  }

  #app{
    align-items:flex-start;
    padding: clamp(22px, 4vh, 44px) 18px 48px;
  }

  .screen{ max-width: 1080px; }

  #header{
    padding: 0 16px clamp(18px, 3vh, 28px);
  }
  #header h1{
    font-size: clamp(2rem, 4vw, 2.8rem);
    margin: 7px 0 4px;
    line-height:1.05;
    text-shadow:none;
  }
  #header .subtitle{
    font-size: clamp(1rem, 2vw, 1.15rem);
    margin:0;
    font-weight:500;
  }

  #board-wrap{ width:100%; }
  .progress-line{ margin-bottom:2px; font-size:.84rem; }
  .board-instructions{ margin-bottom:12px; font-size:.88rem; }

  #board{
    width:max-content;
    max-width:100%;
    margin:0 auto;
    padding: 18px 12px 20px;
    border-radius:14px;
    overflow:visible;
  }
  .rail{
    width:var(--rail-w);
    flex-basis:var(--rail-w);
    background-size:100% var(--tile-h);
  }
  #rail-left{ margin-right:10px; }
  #rail-right{ margin-left:10px; }
  #center-wrap{
    width:var(--center-w);
    flex-basis:var(--center-w);
    min-width:0;
  }
  .center-caption{
    bottom:-24px;
    font-size:.78rem;
    font-style:normal;
    opacity:.58;
  }

  #modal-backdrop{ padding:16px; }
  #restart-confirm-backdrop{ padding:16px; }
  #modal{
    max-width:520px;
    padding:34px 30px 28px;
    border-radius:12px;
  }
  #modal .modal-verse{ font-size:clamp(1.35rem, 3vw, 1.65rem); }
  #modal .modal-interpretation,
  #modal .modal-prompt{ font-size:clamp(1rem, 2.2vw, 1.12rem); }

  @media (max-width: 760px){
    :root{
      --tile-h: 50px;
      --rail-w: 46px;
      --center-w: min(68vw, 300px);
    }
    #app{ padding:20px 10px 36px; }
    #header{ padding-bottom:16px; }
    .eyebrow{ font-size:.72rem; }
    #header h1{ font-size:2rem; }
    #header .subtitle{ font-size:.98rem; }
    .board-instructions{
      max-width:34ch;
      margin:0 auto 10px;
      line-height:1.35;
    }
    #board{
      width:100%;
      padding:14px 6px 18px;
      justify-content:center;
      border-radius:10px;
    }
    #rail-left{ margin-right:6px; }
    #rail-right{ margin-left:6px; }
    .tile-index{ font-size:.62rem; padding:2px 5px; }
    .center-caption{ display:none; }
    #modal-backdrop{
      align-items:flex-end;
      padding:10px;
    }
    #modal{
      max-width:none;
      max-height:88dvh;
      padding:30px 22px max(24px, env(safe-area-inset-bottom));
      border-radius:16px 16px 10px 10px;
    }
    #modal .modal-close{ top:12px; right:14px; }
    #final{ padding:28px 16px 4px; }
  }

  @media (max-width: 390px){
    :root{
      --tile-h: 46px;
      --rail-w: 44px;
      --center-w: calc(100vw - 118px);
    }
    #app{ padding-left:6px; padding-right:6px; }
    #board{ padding-left:4px; padding-right:4px; }
    #rail-left{ margin-right:5px; }
    #rail-right{ margin-left:5px; }
    .tile-index{ font-size:.58rem; }
  }

</style>
</head>

    <p class="modal-interpretation" id="modal-verse"></p>
    <div class="modal-prompt-label" id="modal-type-label-i"></div>
    <p class="modal-interpretation" id="modal-interpretation"></p>
    <div class="modal-prompt-label" id="modal-type-label-r"></div>
    <p class="modal-interpretation" id="modal-prompt"></p>
    <button class="btn-illuminate" id="btn-illuminate">Illuminate</button>
    <p class="modal-prompt-label" id="modal-done-badge" style="display:none;">Already Illuminated</p>
  </div>
</div>

<!-- RESTART CONFIRM -->
<div id="restart-confirm-backdrop" role="dialog" aria-modal="true" aria-labelledby="restart-confirm-title">
  <div id="restart-confirm">
    <p id="restart-confirm-title">Start over?</p>
    <p id="restart-confirm-body">This will re-dim every illuminated tile.</p>
    <div id="restart-confirm-actions">
      <button class="btn-secondary" id="restart-cancel">Cancel</button>
      <button class="btn-illuminate" id="restart-confirm-btn">Restart</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var TILES = [
    { n:1, verse:"Mary got ready and hurried", interpretation:"Mary moves toward relationship rather than remaining alone.", type:"Reflection", prompt:"When things get uncertain, who do I move toward?" },
    { n:2, verse:"She entered Zechariah\u2019s home", interpretation:"Mary is received into another household.", type:"Action", prompt:"Make one space feel more welcoming today." },
    { n:3, verse:"She greeted Elizabeth", interpretation:"Relationship begins with acknowledgment and attention.", type:"Memory", prompt:"Remember a greeting that made you feel unexpectedly at home." },
    { n:4, verse:"The baby leaped in her womb", interpretation:"Joy and recognition can register in the body before they can be explained in words.", type:"Reflection", prompt:"Where have you experienced joy before you had words for it?" },
    { n:5, verse:"Elizabeth was filled with the Holy Spirit", interpretation:"The Holy Spirit enables Elizabeth to recognize and name what God is doing.", type:"Memory", prompt:"Recall a moment that seemed ordinary until you understood it later." },
    { n:6, verse:"Blessed are you among women", interpretation:"Elizabeth recognizes Mary as blessed within what God is doing.", type:"Reflection", prompt:"Who needs to hear something good and true about themselves?" },
    { n:7, verse:"Blessed is she who has believed", interpretation:"Mary is honored for trusting that God will fulfill what God has promised.", type:"Reflection", prompt:"What am I waiting to understand completely before I trust it?" },
    { n:8, verse:"My soul glorifies the Lord", interpretation:"Mary responds to God with her whole self.", type:"Action", prompt:"Say one honest sentence of thanks. No polishing." },
    { n:9, verse:"My spirit rejoices", interpretation:"Her response is not only obedience but delight.", type:"Reversal", prompt:"Replace hurry with delight for one minute." },
    { n:10, verse:"In God my Savior", interpretation:"Mary understands God as one who rescues and restores.", type:"Reflection", prompt:"What am I tired of trying to carry entirely by myself?" },
    { n:11, verse:"Mindful of the humble state", interpretation:"God begins overturning the world\u2019s usual measures of importance.", type:"Action", prompt:"Give someone your undivided attention." },
    { n:12, verse:"All generations will call me blessed", interpretation:"The lowly woman God has favored will become part of the memory of generations.", type:"Reflection", prompt:"Whose quiet goodness deserves to be noticed?" },
    { n:13, verse:"The Mighty One has done great things", interpretation:"God acts decisively in human life and history.", type:"Reflection", prompt:"What good thing in my life feels larger than my own effort?" },
    { n:14, verse:"Holy is his name", interpretation:"God\u2019s holiness reveals power unlike the ways human beings seek and use power.", type:"Reflection", prompt:"How does God\u2019s power differ from the ways people usually use power?" },
    { n:15, verse:"His mercy extends", interpretation:"God\u2019s care continues across generations.", type:"Action", prompt:"Choose gentleness once where irritation would be easier." },
    { n:16, verse:"Those who fear him", interpretation:"Reverence means recognizing God's presence and importance.", type:"Memory", prompt:"Recall a moment when awe rearranged your sense of importance." },
    { n:17, verse:"He has scattered the proud", interpretation:"God disrupts self-exalting thoughts.", type:"Reflection", prompt:"Where does certainty about my own importance make it harder for me to see clearly?" },
    { n:18, verse:"Brought down rulers", interpretation:"Political dominance is not permanent.", type:"Action", prompt:"Use any authority you have to help someone with less." },
    { n:19, verse:"Lifted up the humble", interpretation:"Those pushed down are raised and honored.", type:"Reflection", prompt:"Who around me is overlooked, and how could I make room for them?" },
    { n:20, verse:"Filled the hungry", interpretation:"God responds to physical need, not only spiritual need.", type:"Action", prompt:"Give or share one concrete resource. (A Christmas cookie with Diana counts.)" },
    { n:21, verse:"Sent the rich away empty", interpretation:"Wealth does not guarantee favor or fullness.", type:"Reflection", prompt:"Where might comfort or abundance be making me less attentive to others?" },
    { n:22, verse:"Helped his servant Israel", interpretation:"God\u2019s action concerns a whole people, not only Mary.", type:"Reversal", prompt:"Replace \u201cme first\u201d with \u201cwe flourish together.\u201d" },
    { n:23, verse:"Remembering to be merciful", interpretation:"God remembers and keeps the mercy promised long ago.", type:"Reversal", prompt:"Turn forgotten responsibility into remembered care." },
    { n:24, verse:"To Abraham and his descendants", interpretation:"Mary belongs to a story that began long before her.", type:"Reflection", prompt:"How might my life be part of a story that began before me?" },
    { n:25, verse:"Forever", interpretation:"God\u2019s mercy and promise extend beyond one generation.", type:"Reflection", prompt:"What values or acts of mercy do I hope to pass on?" },
    { n:26, verse:"Mary stayed with her about three months", interpretation:"The visit isn\u2019t a brief exchange but a season of shared life before Mary returns home.", type:"Reflection", prompt:"What relationship deserves more than a passing visit from me?" }
  ];

  var LEFT_COUNT = 13;   // tiles 1-13, left rail, top to bottom
  var RIGHT_COUNT = 13;  // tiles 14-26, right rail, bottom to top

  // -----------------------------------------------------------------
  // DOM refs
  // -----------------------------------------------------------------
  var finalEl = document.getElementById('final');
  var railLeft = document.getElementById('rail-left');
  var railRight = document.getElementById('rail-right');
  var centerImage = document.getElementById('center-image');
  var centerFrame = document.getElementById('center-frame');
  var wreathEl = document.getElementById('wreath');
  var progressLine = document.getElementById('progress-line');
  var boardInstructions = document.getElementById('board-instructions');
  var modalBackdrop = document.getElementById('modal-backdrop');
  var modalVerse = document.getElementById('modal-verse');
  var modalTypeLabel = document.getElementById('modal-type-label');
  var modalTypeLabelV = document.getElementById('modal-type-label-v');
  var modalTypeLabelI = document.getElementById('modal-type-label-i');
  var modalTypeLabelR = document.getElementById('modal-type-label-r');
  var modalInterp = document.getElementById('modal-interpretation');
  var modalPrompt = document.getElementById('modal-prompt');
  var btnIlluminate = document.getElementById('btn-illuminate');
  var modalDoneBadge = document.getElementById('modal-done-badge');
  var modalCloseBtn = document.getElementById('modal-close');
  var btnRestart = document.getElementById('btn-restart');
  var restartConfirmBackdrop = document.getElementById('restart-confirm-backdrop');
  var restartConfirmBtn = document.getElementById('restart-confirm-btn');
  var restartCancelBtn = document.getElementById('restart-cancel');

  // -----------------------------------------------------------------
  // State + persistence
  // -----------------------------------------------------------------
  var STORAGE_KEY = 'the-visitation-progress-v1';
  var state = { completed: [] };

  function loadState(){
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.completed)){
          state.completed = parsed.completed.filter(function(n){ return n >= 1 && n <= 26; });
        }
      }
    }catch(e){ /* localStorage unavailable -- continue without persistence */ }
  }

  function saveState(){
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ /* ignore */ }
  }

  function isDone(n){ return state.completed.indexOf(n) !== -1; }
  function nextTileNumber(){
    for(var i=1;i<=26;i++){ if(!isDone(i)) return i; }
    return null; // all done
  }

  // -----------------------------------------------------------------
  // Build tiles
  // -----------------------------------------------------------------
  var tileEls = {}; // n -> element

  function getTileHeight(){
    var value = getComputedStyle(document.documentElement).getPropertyValue('--tile-h').trim();
    if(value.endsWith('px')) return parseFloat(value);
    // CSS clamp()/vh values are resolved by measuring a temporary element.
    var probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;visibility:hidden;height:var(--tile-h);';
    document.body.appendChild(probe);
    var h = probe.getBoundingClientRect().height || 54;
    probe.remove();
    return h;
  }

  function layoutRails(){
    var h = getTileHeight();
    [railLeft, railRight].forEach(function(container){
      container.style.height = (13 * h) + 'px';
      Array.prototype.forEach.call(container.querySelectorAll('.tile'), function(btn, i){
        btn.style.top = (i * h) + 'px';
        btn.style.height = h + 'px';
      });
    });
  }

  function buildRail(container, count, tileNumbers){
    for(var i=0;i<count;i++){
      var n = tileNumbers[i];
      var btn = document.createElement('button');
      btn.className = 'tile';
      btn.setAttribute('data-n', n);
      btn.setAttribute('aria-label', 'Tile ' + n + ' of 26');

      var hit = document.createElement('span');
      hit.className = 'tile-hit';
      var idx = document.createElement('span');
      idx.className = 'tile-index';
      idx.textContent = n;
      hit.appendChild(idx);
      btn.appendChild(hit);

      btn.addEventListener('click', function(){
        var num = parseInt(this.getAttribute('data-n'), 10);
        onTileClick(num);
      });

      container.appendChild(btn);
      tileEls[n] = btn;
    }
  }

  (function initRails(){
    var leftNums = [];
    for(var i=1;i<=LEFT_COUNT;i++) leftNums.push(i);
    var rightNums = []; // physical top -> bottom order for the right rail = tile 26 ... tile 14
    for(var j=26;j>=14;j--) rightNums.push(j);

    buildRail(railLeft, LEFT_COUNT, leftNums);
    buildRail(railRight, RIGHT_COUNT, rightNums);
    layoutRails();
    var resizeTimer;
    window.addEventListener('resize', function(){
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(layoutRails, 80);
    });
  })();

  // -----------------------------------------------------------------
  // Render state -> DOM
  // -----------------------------------------------------------------
  var lastActiveN = null; // tracks the previously-active tile so we can
                           // call attention to it when it changes rails

  function render(){
    var upcoming = nextTileNumber();
    var completedCount = state.completed.length;

    for(var n=1;n<=26;n++){
      var el = tileEls[n];
      el.classList.remove('active','locked','done');
      if(isDone(n)){
        el.classList.add('done');
      } else if(n === upcoming){
        el.classList.add('active');
      } else {
        el.classList.add('locked');
      }
    }

    // When the active tile changes -- especially the 13 -> 14 handoff, where
    // the next pane jumps from the bottom of the left window to the bottom
    // of the right window -- draw the eye to it with a scroll + one-off flash.
    if(lastActiveN !== null && upcoming !== null && upcoming !== lastActiveN){
      var newActiveEl = tileEls[upcoming];
      if(newActiveEl){
        if(typeof newActiveEl.scrollIntoView === 'function'){
          newActiveEl.scrollIntoView({behavior:'smooth', block:'center', inline:'nearest'});
        }
        newActiveEl.classList.add('flash-new');
        setTimeout(function(){ newActiveEl.classList.remove('flash-new'); }, 1500);
      }
    }
    lastActiveN = upcoming;

    // brighten center image progressively
    var pct = completedCount / 26;
    var brightness = 0.60 + pct * 0.42;   // 0.60 -> 1.02
    var saturate = 0.30 + pct * 0.72;     // 0.30 -> 1.02
    var contrast = 0.84 + pct * 0.18;     // 0.84 -> 1.02
    centerImage.style.filter = 'saturate(' + saturate.toFixed(2) + ') brightness(' + brightness.toFixed(2) + ') contrast(' + contrast.toFixed(2) + ')';

    // illuminate the lattice glass behind the oval in step with the tiles
    var bgBrightness = 0.55 + pct * 0.55;   // 0.55 -> 1.10
    var bgSaturate = 0.35 + pct * 0.80;     // 0.35 -> 1.15
    var bgContrast = 0.82 + pct * 0.22;     // 0.82 -> 1.04
    centerFrame.style.filter = 'saturate(' + bgSaturate.toFixed(2) + ') brightness(' + bgBrightness.toFixed(2) + ') contrast(' + bgContrast.toFixed(2) + ')';

    if(completedCount >= 26){
      progressLine.textContent = '';
      boardInstructions.textContent = 'Scroll down to Restart';
      finalEl.style.display = 'block';
      wreathEl.classList.add('show');
    } else {
      progressLine.textContent = (completedCount + 1) + ' of 26';
      if(upcoming === 14){
        boardInstructions.textContent = 'Continue on the right window, starting at the bottom.';
      } else if(upcoming <= 13){
        boardInstructions.textContent = 'Tap the glowing pane on the left, read the reflection, then choose Illuminate.';
      } else {
        boardInstructions.textContent = 'Tap the glowing pane on the right, read the reflection, then choose Illuminate.';
      }
      finalEl.style.display = 'none';
      wreathEl.classList.remove('show');
    }

    saveState();
  }

  // -----------------------------------------------------------------
  // Modal
  // -----------------------------------------------------------------
  var openTileNumber = null;

  function openModal(n, readOnly){
    var data = TILES[n-1];
    openTileNumber = n;
    modalTypeLabel.textContent = data.n;
    modalTypeLabelV.textContent = 'Verse: ';
    modalTypeLabelI.textContent = 'Interpretation: ';
    modalTypeLabelR.textContent = 'Reflection: ';
    modalVerse.textContent = '\u201c' + data.verse + '\u201d';
    modalInterp.textContent = data.interpretation;
    modalPrompt.textContent = data.prompt;

    if(readOnly){
      btnIlluminate.style.display = 'none';
      modalDoneBadge.style.display = 'block';
    } else {
      btnIlluminate.style.display = 'block';
      modalDoneBadge.style.display = 'none';
    }

    modalBackdrop.style.display = 'flex';
    modalCloseBtn.focus();
  }

  function closeModal(){
    modalBackdrop.style.display = 'none';
    openTileNumber = null;
  }

  function onTileClick(n){
    if(isDone(n)){
      openModal(n, true);
      return;
    }
    var upcoming = nextTileNumber();
    if(n !== upcoming) return; // locked tile, ignore
    openModal(n, false);
  }

  btnIlluminate.addEventListener('click', function(){
    if(openTileNumber === null) return;
    if(!isDone(openTileNumber)){
      state.completed.push(openTileNumber);
    }
    closeModal();
    render();
  });

  modalCloseBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', function(e){
    if(e.target === modalBackdrop) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && modalBackdrop.style.display === 'flex') closeModal();
    if(e.key === 'Escape' && restartConfirmBackdrop.style.display === 'flex') closeRestartConfirm();
  });

  // -----------------------------------------------------------------
  // Restart
  // -----------------------------------------------------------------
  function openRestartConfirm(){
    restartConfirmBackdrop.style.display = 'flex';
    restartCancelBtn.focus();
  }
  function closeRestartConfirm(){
    restartConfirmBackdrop.style.display = 'none';
  }

  btnRestart.addEventListener('click', function(){
    openRestartConfirm();
  });
  restartCancelBtn.addEventListener('click', closeRestartConfirm);
  restartConfirmBackdrop.addEventListener('click', function(e){
    if(e.target === restartConfirmBackdrop) closeRestartConfirm();
  });
  restartConfirmBtn.addEventListener('click', function(){
    state.completed = [];
    lastActiveN = null; // avoid an unwanted flash/scroll on the very next render
    closeRestartConfirm();
    render();
  });

  // -----------------------------------------------------------------
  // Init
  // -----------------------------------------------------------------
  loadState();
  render();

})();
</script>
</body>
</html>
